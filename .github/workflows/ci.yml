name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Relatório do smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Artefato web
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.ref_name }}
          path: apps/web/dist/
          if-no-files-found: error
      - name: Artefato API
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.ref_name }}
          include-hidden-files: true
          path: |
            apps/api/dist/
            apps/api/package.json
            apps/web/package.json
            package.json
            package-lock.json
            .npmrc
            .nvmrc
            .env.example
          if-no-files-found: error
